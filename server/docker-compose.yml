services:
  pmc-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PMC_SERVER_NAME: "Nexora Server"
      PMC_SERVER_PASSWORD: ""
      PMC_DATA_DIR: /data
      PMC_MAX_TRANSFER_BYTES: "1099511627776"
    ports:
      - "7412:7412"
    volumes:
      - pmc-server-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7412/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  pmc-server-data:

