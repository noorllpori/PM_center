<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Nexora 本机控制台</title>
  <style>
    :root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#20242b;background:#f6f7f9;letter-spacing:0}
    *{box-sizing:border-box}body{margin:0;min-width:320px}button,input{font:inherit;letter-spacing:0}
    button{cursor:pointer}.shell{min-height:100vh;background:#f6f7f9}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 24px;border-bottom:1px solid #dde1e7;background:#fff;position:sticky;top:0;z-index:4}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}.brand img{width:30px;height:30px;object-fit:contain}.brand strong{font-size:15px}.brand span{font-size:12px;color:#737b87}
    .connection{display:flex;align-items:center;gap:8px;font-size:12px;color:#59616d}.dot{width:8px;height:8px;border-radius:50%;background:#1aa374}.dot.offline{background:#d54a4a}
    .layout{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:calc(100vh - 58px)}.sidebar{border-right:1px solid #dde1e7;background:#fbfbfc;padding:18px 12px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:9px 11px;border-radius:6px;color:#59616d}.nav button.active{background:#e9f3ff;color:#1769aa;font-weight:600}
    .main{min-width:0;padding:24px 28px 48px}.section{max-width:1040px;margin:0 auto}.section[hidden]{display:none}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid #dde1e7}.heading h1{margin:0;font-size:21px}.heading p{margin:5px 0 0;color:#737b87;font-size:13px}
    .actions{display:flex;flex-wrap:wrap;gap:8px}.button{border:1px solid #cfd5dc;background:#fff;color:#303640;padding:8px 12px;border-radius:6px}.button:hover{background:#f1f3f5}.button.primary{border-color:#1778be;background:#1778be;color:#fff}.button.primary:hover{background:#1269a7}.button.danger{border-color:#d74b4b;color:#c23737}.button:disabled{cursor:not-allowed;opacity:.5}
    .summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid #dde1e7;margin-top:8px}.metric{padding:18px 16px;border-right:1px solid #e5e8ec}.metric:last-child{border-right:0}.metric span{display:block;font-size:12px;color:#737b87}.metric strong{display:block;margin-top:6px;font-size:18px;overflow-wrap:anywhere}
    .block{padding:22px 0;border-bottom:1px solid #dde1e7}.block h2{font-size:15px;margin:0 0 14px}.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px}.row{display:flex;justify-content:space-between;gap:16px;font-size:13px}.row span:first-child{color:#737b87}.row span:last-child{text-align:right;overflow-wrap:anywhere}
    .module-table{width:100%;border-collapse:collapse;font-size:13px}.module-table th,.module-table td{text-align:left;padding:10px 8px;border-bottom:1px solid #e5e8ec}.module-table th{color:#737b87;font-weight:500}.state{display:inline-flex;align-items:center;min-height:22px;padding:2px 7px;border-radius:4px;background:#eef0f3;color:#59616d;font-size:11px}.state.running{background:#e4f6ef;color:#147253}.state.error,.state.blocked{background:#fde9e8;color:#b93636}
    .form{max-width:720px}.field{padding:16px 0;border-bottom:1px solid #e1e5ea}.field label{display:flex;justify-content:space-between;gap:20px;align-items:center}.field-text strong{display:block;font-size:14px}.field-text span{display:block;margin-top:4px;color:#737b87;font-size:12px}.switch{width:42px;height:24px;appearance:none;border-radius:12px;background:#c8ced6;position:relative;flex:none;transition:.15s}.switch:checked{background:#1778be}.switch:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s;box-shadow:0 1px 3px #0003}.switch:checked:after{left:21px}.text-input{width:100%;margin-top:10px;border:1px solid #cfd5dc;background:#fff;color:#20242b;border-radius:6px;padding:9px 10px;outline:none}.text-input:focus{border-color:#1778be;box-shadow:0 0 0 3px #1778be20}.savebar{display:flex;align-items:center;gap:12px;padding-top:18px}.message{font-size:12px;color:#147253}.message.error{color:#b93636}
    .danger-zone{border-top:1px solid #efcaca;margin-top:28px;padding-top:20px}.danger-zone h2{color:#b93636}.danger-actions{display:flex;gap:8px;flex-wrap:wrap}
    dialog{border:1px solid #d7dce2;border-radius:8px;padding:0;max-width:420px;width:calc(100% - 32px);background:#fff;color:#20242b;box-shadow:0 20px 60px #0004}dialog::backdrop{background:#11182766}.dialog-body{padding:20px}.dialog-body h2{font-size:17px;margin:0}.dialog-body p{font-size:13px;color:#626a75;line-height:1.6}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid #e1e5ea}
    .fatal{max-width:620px;margin:80px auto;padding:24px;border:1px solid #efcaca;background:#fff;border-radius:8px}.fatal h1{font-size:18px}.fatal p{color:#737b87;line-height:1.6}
    @media(max-width:760px){.topbar{padding:0 14px}.brand span{display:none}.layout{grid-template-columns:1fr}.sidebar{position:sticky;top:58px;z-index:3;border-right:0;border-bottom:1px solid #dde1e7;padding:8px 12px}.nav{flex-direction:row}.nav button{flex:1;text-align:center}.main{padding:18px 14px 36px}.heading{display:block}.actions{margin-top:14px}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid #e5e8ec}.rows{grid-template-columns:1fr}.module-table th:nth-child(3),.module-table td:nth-child(3){display:none}}
    @media(prefers-color-scheme:dark){:root{color:#e6e9ed;background:#15171b}.shell{background:#15171b}.topbar,.sidebar,dialog,.fatal{background:#1d2025;border-color:#343941}.brand span,.heading p,.connection,.metric span,.row span:first-child,.module-table th,.field-text span,.dialog-body p{color:#9ca4af}.layout,.sidebar,.heading,.summary,.block,.module-table th,.module-table td,.field,.dialog-actions{border-color:#343941}.nav button{color:#aeb5bf}.nav button.active{background:#19354b;color:#7cc5f4}.button,.text-input{background:#24282e;border-color:#414750;color:#e6e9ed}.button:hover{background:#2b3037}.metric{border-color:#343941}.state{background:#30353d;color:#b8c0ca}.state.running{background:#173d32;color:#78d7b5}.state.error,.state.blocked{background:#472526;color:#ff9a96}.switch{background:#555c66}.fatal{background:#1d2025}}
  </style>
</head>
<body>
  <div id="fatal" class="fatal" hidden><h1>无法连接 Nexora</h1><p id="fatal-message"></p></div>
  <div id="app" class="shell" hidden>
    <header class="topbar"><div class="brand"><img src="/assets/nexora-logo.png" alt=""><div><strong>Nexora</strong><span> 本机控制台</span></div></div><div class="connection"><span id="connection-dot" class="dot"></span><span id="connection-text">已连接</span></div></header>
    <div class="layout">
      <aside class="sidebar"><nav class="nav"><button type="button" data-view="status" class="active">状态</button><button type="button" data-view="settings">设置</button></nav></aside>
      <main class="main">
        <section id="view-status" class="section">
          <div class="heading"><div><h1>运行状态</h1><p id="status-subtitle"></p></div><div class="actions"><button id="show-window" class="button primary" type="button">显示主窗口</button><button id="hide-window" class="button" type="button">隐藏主窗口</button><button id="refresh" class="button" type="button">刷新</button></div></div>
          <div class="summary"><div class="metric"><span>版本</span><strong id="version">-</strong></div><div class="metric"><span>当前方案</span><strong id="profile">-</strong></div><div class="metric"><span>运行模块</span><strong id="module-count">-</strong></div><div class="metric"><span>活动资源</span><strong id="resource-count">-</strong></div></div>
          <div class="block"><h2>本机服务</h2><div class="rows"><div class="row"><span>访问地址</span><span id="address">-</span></div><div class="row"><span>主窗口</span><span id="window-state">-</span></div><div class="row"><span>设置修改</span><span id="permission-settings">-</span></div><div class="row"><span>重启 / 退出</span><span id="permission-control">-</span></div></div></div>
          <div class="block"><h2>模块</h2><div style="overflow:auto"><table class="module-table"><thead><tr><th>模块</th><th>状态</th><th>健康</th><th>资源</th></tr></thead><tbody id="modules"></tbody></table></div></div>
          <div class="danger-zone"><h2>程序控制</h2><div class="danger-actions"><button id="restart" class="button danger" type="button">重启 Nexora</button><button id="exit" class="button danger" type="button">退出 Nexora</button></div></div>
        </section>
        <section id="view-settings" class="section" hidden>
          <div class="heading"><div><h1>常规设置</h1><p>仅显示适合在本机浏览器中调整的项目。</p></div></div>
          <form id="settings-form" class="form">
            <div class="field"><label><span class="field-text"><strong>启动后恢复上次会话</strong><span>恢复项目标签、工作区标签和独立窗口。</span></span><input id="auto-open" class="switch" type="checkbox"></label></div>
            <div class="field"><label><span class="field-text"><strong>关闭项目标签页时确认</strong><span>关闭项目及其资源前显示确认。</span></span><input id="confirm-project" class="switch" type="checkbox"></label></div>
            <div class="field"><label><span class="field-text"><strong>关闭文件标签页时确认</strong><span>关闭项目内部文件标签前显示确认。</span></span><input id="confirm-file" class="switch" type="checkbox"></label></div>
            <div class="field"><label for="projects-root"><span class="field-text"><strong>项目根目录</strong><span>留空时不扫描统一项目目录。</span></span></label><input id="projects-root" class="text-input" type="text" autocomplete="off"></div>
            <div class="savebar"><button id="save-settings" class="button primary" type="submit">保存设置</button><span id="save-message" class="message"></span></div>
          </form>
        </section>
      </main>
    </div>
  </div>
  <dialog id="confirm-dialog"><div class="dialog-body"><h2 id="dialog-title"></h2><p id="dialog-message"></p></div><div class="dialog-actions"><button id="dialog-cancel" class="button" type="button">取消</button><button id="dialog-confirm" class="button danger" type="button">确认</button></div></dialog>
  <script>
    const sessionKey='pm-center-local-web-token';
    const hashToken=new URLSearchParams(location.hash.slice(1)).get('token');
    if(hashToken){sessionStorage.setItem(sessionKey,hashToken);history.replaceState(null,'',location.pathname)}
    const token=sessionStorage.getItem(sessionKey)||'';
    const app=document.getElementById('app'),fatal=document.getElementById('fatal'),fatalMessage=document.getElementById('fatal-message');
    const dialog=document.getElementById('confirm-dialog');let bootstrapData=null,pendingAction=null;
    async function api(path,options={}){const headers={...(options.headers||{}),Authorization:`Bearer ${token}`};if(options.body)headers['Content-Type']='application/json';const response=await fetch(path,{...options,headers});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`请求失败 (${response.status})`);return data}
    function setConnection(online,text){document.getElementById('connection-dot').classList.toggle('offline',!online);document.getElementById('connection-text').textContent=text}
    function stateLabel(value){return({running:'运行中',disabled:'已停用',error:'错误',blocked:'被阻止',starting:'启动中',stopping:'停止中','restart-required':'需要重启',resolving:'解析依赖'})[value]||value}
    function render(data){bootstrapData=data;app.hidden=false;fatal.hidden=true;setConnection(true,'已连接');document.getElementById('version').textContent=data.app.version;document.getElementById('profile').textContent=data.profile?.name||'未初始化';document.getElementById('module-count').textContent=`${data.modules.filter(item=>item.state==='running').length}/${data.modules.length}`;document.getElementById('resource-count').textContent=data.resourceCount;document.getElementById('address').textContent=data.app.address;document.getElementById('window-state').textContent=data.app.windowVisible?'已显示':'已隐藏';document.getElementById('status-subtitle').textContent=`更新于 ${new Date().toLocaleTimeString('zh-CN',{hour12:false})}`;document.getElementById('permission-settings').textContent=data.permissions.allowSettingsWrite?'允许':'只读';document.getElementById('permission-control').textContent=`重启${data.permissions.allowRestart?'允许':'关闭'} · 退出${data.permissions.allowExit?'允许':'关闭'}`;document.getElementById('show-window').disabled=data.app.windowVisible;document.getElementById('hide-window').disabled=!data.app.windowVisible;document.getElementById('restart').disabled=!data.permissions.allowRestart;document.getElementById('exit').disabled=!data.permissions.allowExit;document.getElementById('save-settings').disabled=!data.permissions.allowSettingsWrite;document.getElementById('auto-open').checked=data.settings.autoOpenLastProject;document.getElementById('confirm-project').checked=data.settings.confirmProjectTabClose;document.getElementById('confirm-file').checked=data.settings.confirmFileTabClose;document.getElementById('projects-root').value=data.settings.projectsRootDir||'';document.getElementById('modules').innerHTML=data.modules.map(item=>`<tr><td>${escapeHtml(item.name)}</td><td><span class="state ${item.state}">${escapeHtml(stateLabel(item.state))}</span></td><td>${escapeHtml(item.health?.message||'-')}</td><td>${item.resourceCount}</td></tr>`).join('')}
    function escapeHtml(value){return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
    async function load(){if(!token){fatal.hidden=false;fatalMessage.textContent='缺少访问令牌，请从 Nexora 的设置或功能中心重新打开。';return}try{render(await api('/api/bootstrap'))}catch(error){app.hidden=true;fatal.hidden=false;fatalMessage.textContent=error.message;setConnection(false,'连接失败')}}
    async function action(path){try{await api(path,{method:'POST'});await load()}catch(error){setConnection(false,error.message)}}
    document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(item=>item.classList.toggle('active',item===button));document.querySelectorAll('.section').forEach(section=>section.hidden=section.id!==`view-${button.dataset.view}`)}));
    document.getElementById('refresh').onclick=load;document.getElementById('show-window').onclick=()=>action('/api/window/show');document.getElementById('hide-window').onclick=()=>action('/api/window/hide');
    document.getElementById('settings-form').addEventListener('submit',async event=>{event.preventDefault();const message=document.getElementById('save-message');message.className='message';message.textContent='保存中...';try{const data=await api('/api/settings',{method:'PUT',body:JSON.stringify({autoOpenLastProject:document.getElementById('auto-open').checked,confirmProjectTabClose:document.getElementById('confirm-project').checked,confirmFileTabClose:document.getElementById('confirm-file').checked,projectsRootDir:document.getElementById('projects-root').value.trim()||null})});message.textContent='已保存';bootstrapData.settings=data.settings}catch(error){message.className='message error';message.textContent=error.message}});
    function confirmAction(action){pendingAction=action;const restart=action==='restart';document.getElementById('dialog-title').textContent=restart?'重启 Nexora':'退出 Nexora';document.getElementById('dialog-message').textContent=`当前有 ${bootstrapData?.resourceCount||0} 个活动资源。${restart?'重启':'退出'}会先停止模块、任务和后台服务。`;document.getElementById('dialog-confirm').textContent=restart?'确认重启':'确认退出';dialog.showModal()}
    document.getElementById('restart').onclick=()=>confirmAction('restart');document.getElementById('exit').onclick=()=>confirmAction('exit');document.getElementById('dialog-cancel').onclick=()=>{pendingAction=null;dialog.close()};document.getElementById('dialog-confirm').onclick=async()=>{const actionName=pendingAction;dialog.close();pendingAction=null;if(!actionName)return;try{await api(`/api/app/${actionName}`,{method:'POST',body:JSON.stringify({confirmation:actionName})});setConnection(false,actionName==='restart'?'正在重启':'正在退出');if(actionName==='restart'){setTimeout(waitForRestart,1200)}else{document.querySelectorAll('button,input').forEach(item=>item.disabled=true)}}catch(error){setConnection(false,error.message)}};
    async function waitForRestart(){for(let attempt=0;attempt<60;attempt++){try{const response=await fetch('/health',{cache:'no-store'});if(response.ok){await load();return}}catch{}await new Promise(resolve=>setTimeout(resolve,1000))}setConnection(false,'重启后未重新连接')}
    load();
  </script>
</body>
</html>
